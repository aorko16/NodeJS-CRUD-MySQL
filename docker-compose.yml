version: "3.8"

services:

  # MySQL Database container
  mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass   # root password
      MYSQL_DATABASE: test_db         # database name
      MYSQL_USER: appuser             # app user (not root)
      MYSQL_PASSWORD: apppass         # app user password
    ports:
      - "3306:3306"                   # expose MySQL port
    volumes:
      - mysql_data:/var/lib/mysql     # save data even after container stops
    healthcheck:                      # check if MySQL is really ready
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s                   # check every 10 seconds
      timeout: 5s                     # wait max 5 seconds
      retries: 5                      # try 5 times before giving up

  # Node.js App container
  app:
    build: .                          # build using our Dockerfile
    container_name: node_server
    restart: always
    ports:
      - "5000:5000"                   # expose app port
    depends_on:
      mysql:
        condition: service_healthy    # wait for MySQL to be ready first
    environment:
      DB_HOST: mysql                  # mysql container name = hostname
      DB_NAME: test_db
      DB_USER: appuser
      DB_PASSWORD: apppass
      DATABASE_URL: mysql://appuser:apppass@mysql:3306/test_db

# Save MySQL data permanently
volumes:
  mysql_data: